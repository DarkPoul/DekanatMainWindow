version: "3.8"

services:
  app:
    build: .
    container_name: dekanat-main-window
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/dekanat?useSSL=false&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: dekanat
      SPRING_DATASOURCE_PASSWORD: secret
    depends_on:
      - db

  db:
    image: mariadb:10.11
    container_name: dekanat-db
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: dekanat
      MARIADB_USER: dekanat
      MARIADB_PASSWORD: secret
      MARIADB_ROOT_PASSWORD: rootpass
    command: ["mysqld", "--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - db-data:/var/lib/mysql

volumes:
  db-data:
